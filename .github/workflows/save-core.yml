name: Save VPN core

# Копирует ядро VPN для iPhone (и его исходный код) в «Релизы» этого репозитория,
# чтобы сборка не зависела от чужих серверов.
on:
  workflow_dispatch:
    inputs:
      core_version:
        description: 'Версия ядра (как в dependencies.properties)'
        default: '5.5.5'

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.core_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download core
        run: |
          curl -fL --retry 5 -o hiddify-lib-ios.tar.gz "https://github.com/hiddify/hiddify-core/releases/download/v${V}/hiddify-lib-ios.tar.gz"
          curl -fL --retry 5 -o "core-source-v${V}.tar.gz" "https://github.com/hiddify/hiddify-core/archive/refs/tags/v${V}.tar.gz"
          tar tzf hiddify-lib-ios.tar.gz | grep -q "HiddifyCore.xcframework" || { echo "::error::в архиве нет ядра"; exit 1; }
          sha256sum hiddify-lib-ios.tar.gz "core-source-v${V}.tar.gz" | tee SHA256SUMS.txt
          ls -lh

      - name: Create release core-v${{ inputs.core_version }}
        run: |
          gh release delete "core-v${V}" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "core-v${V}" hiddify-lib-ios.tar.gz "core-source-v${V}.tar.gz" SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Ядро iOS ${V}" \
            --notes "Копия ядра VPN для сборки приложения (hiddify-lib-ios.tar.gz) и его исходный код. Не удалять: сборка берёт ядро отсюда."
          echo "✅ ядро сохранено: https://github.com/$GITHUB_REPOSITORY/releases/tag/core-v${V}"
