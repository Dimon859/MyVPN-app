name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID из профиля (application-identifier без Team ID)'
        default: 'app.wolf1222.pomegranate4762'
      app_group:
        description: 'App Group из профиля'
        default: 'group.88a127e35b3d8761.1'
      team_id:
        description: 'Team ID из профиля'
        default: 'HH34UVC32L'
      app_name:
        description: 'Название под иконкой на iPhone'
        default: 'Tunnex'
      app_version:
        description: 'Версия приложения (например 1.0.0)'
        default: '1.7.0'

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      BUNDLE: ${{ inputs.bundle_id }}
      GROUP: ${{ inputs.app_group }}
      TEAM: ${{ inputs.team_id }}
      APPNAME: ${{ inputs.app_name }}
      IPA: ${{ inputs.app_name }}-${{ inputs.app_version }}-b${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: |
          make ios-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Set my Bundle ID, Team and App Group
        run: |
          sed -i '' "s/^BASE_BUNDLE_IDENTIFIER=.*/BASE_BUNDLE_IDENTIFIER=${BUNDLE}/" ios/Base.xcconfig
          sed -i '' "s/^DEVELOPMENT_TEAM=.*/DEVELOPMENT_TEAM=${TEAM}/" ios/Base.xcconfig
          sed -i '' "s/group\.\$(BASE_BUNDLE_IDENTIFIER)/${GROUP}/" ios/Runner/Runner.entitlements ios/HiddifyPacketTunnel/HiddifyPacketTunnel.entitlements
          sed -i '' "s/static let groupName = .*/static let groupName = \"${GROUP}\"/" ios/Shared/FilePath.swift
          plutil -replace CFBundleDisplayName -string "$APPNAME" ios/Runner/Info.plist
          echo "--- проверка ---"
          plutil -extract CFBundleDisplayName raw ios/Runner/Info.plist
          grep -n "BUNDLE\|TEAM" ios/Base.xcconfig
          grep -n "$GROUP" ios/Runner/Runner.entitlements ios/HiddifyPacketTunnel/HiddifyPacketTunnel.entitlements ios/Shared/FilePath.swift
          [ "$(grep -c "$GROUP" ios/Runner/Runner.entitlements ios/HiddifyPacketTunnel/HiddifyPacketTunnel.entitlements ios/Shared/FilePath.swift | awk -F: '{s+=$2} END {print s}')" -ge 3 ] || { echo "::error::App Group не подставилась"; exit 1; }

      - name: Rebrand
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash rebrand.sh

      - name: Set version
        env:
          VER: ${{ inputs.app_version }}
          NUM: ${{ github.run_number }}
        run: |
          sed -i '' "s/^version: .*/version: ${VER}+${NUM}/" pubspec.yaml
          sed -i '' -E "s/MARKETING_VERSION = [0-9.]+;/MARKETING_VERSION = ${VER};/g; s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${NUM};/g" ios/Runner.xcodeproj/project.pbxproj
          grep -n "^version:" pubspec.yaml
          echo "версия расширения VPN: $(grep -c "MARKETING_VERSION = ${VER};" ios/Runner.xcodeproj/project.pbxproj) мест"

      - name: Prepare iOS
        run: |
          CV=$(grep '^core.version=' dependencies.properties | cut -d= -f2)
          MY="https://github.com/${GITHUB_REPOSITORY}/releases/download/core-v${CV}"
          if curl -fsIL "$MY/hiddify-lib-ios.tar.gz" >/dev/null; then
            echo "✅ ядро $CV из своего репозитория"; URL="$MY"
          else
            echo "::warning::своей копии ядра $CV нет (Actions → Save VPN core), беру у Hiddify"
            URL="https://github.com/hiddify/hiddify-core/releases/download/v${CV}"
          fi
          make ios-prepare CHANNEL=prod CORE_URL="$URL"

      - name: Build iOS without signing
        run: make ios-validate CHANNEL=prod

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ls Payload/Runner.app/PlugIns || echo "::warning::PlugIns не найден"
          zip -qry "$IPA.ipa" Payload
          ls -lh "$IPA.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}.ipa
          retention-days: 30
