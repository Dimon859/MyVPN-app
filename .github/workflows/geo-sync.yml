name: Sync rule sets

# Копирует правила маршрутизации (обход сайтов региона, блокировка рекламы и т. п.)
# в ветку rule-set этого репозитория. Приложение скачивает их оттуда.
# Если источник пропадёт, у тебя останется последняя копия.
on:
  schedule:
    - cron: '17 3 * * 1'   # каждый понедельник
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: geo-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download rule sets
        run: |
          set -e
          git clone -q --depth 1 -b rule-set https://github.com/hiddify/hiddify-geo up
          mkdir -p new/sagernet new/geosite new/geoip
          cp -R up/block up/country new/
          # списки по сервисам и странам (geosite:vk, geoip:ru…) — для импортированных правил и правил подписок
          git clone -q --depth 1 -b release https://github.com/runetfreedom/russia-v2ray-rules-dat rf
          cp rf/sing-box/rule-set-geosite/geosite-*.srs new/geosite/
          cp rf/sing-box/rule-set-geoip/geoip-*.srs new/geoip/
          [ -s new/geosite/geosite-youtube.srs ] && [ -s new/geoip/geoip-ru.srs ] || { echo "::error::нет geosite/geoip"; exit 1; }
          for f in apple android googlefcm ubuntu debian fedora archlinux; do
            curl -fsSL --retry 5 -o "new/sagernet/geosite-$f.srs" \
              "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-$f.srs"
          done
          # каждый файл — настоящий набор правил sing-box (начинается с «SRS») и не пустой
          n=0
          for f in $(find new -name '*.srs'); do
            [ -s "$f" ] && [ "$(head -c 3 "$f")" = "SRS" ] || { echo "::error::плохой файл $f"; exit 1; }
            n=$((n+1))
          done
          [ "$n" -ge 1000 ] || { echo "::error::слишком мало файлов: $n"; exit 1; }
          echo "✅ скачано наборов правил: $n"

      - name: Update branch rule-set
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" rule-set >/dev/null; then
            git clone -q --depth 1 -b rule-set "$URL" out
          else
            git init -q out && git -C out checkout -q --orphan rule-set
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R new/. out/
          printf "# Правила маршрутизации MyVPN\n\nКопия наборов правил для приложения. Обновляется автоматически (Actions → Sync rule sets).\n\n- block/, country/ — из hiddify/hiddify-geo\n- sagernet/ — из SagerNet/sing-geosite\n- geosite/, geoip/ — из runetfreedom/russia-v2ray-rules-dat (списки по сервисам и странам)\n" > out/README.md
          cd out
          git add -A
          if git diff --cached --quiet; then echo "✅ без изменений"; exit 0; fi
          git commit -qm "Обновление правил $(date -u +%F)"
          git push -q "$URL" HEAD:rule-set
          echo "✅ ветка rule-set обновлена"

      # GitHub сам отключает расписание, если в репозитории 60 дней нет коммитов.
      # Это «продлевает» его каждую неделю, чтобы обновления не остановились.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/geo-sync.yml/enable" && echo "✅ расписание продлено"
